name: Candidate Portal Regression

on:
  push:
    branches:
      - v2
      - main
  pull_request:
    branches:
      - v2
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Candidate BFF regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: candbff

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: candbff/go.mod
          cache-dependency-path: candbff/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go regression tests
        run: go test ./...

  regression:
    name: Candidate Playwright regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: candweb/vue-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: candweb/vue-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build candidate portal
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright regression
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: candidate-playwright-report
          path: |
            candweb/vue-web/playwright-report/
            candweb/vue-web/test-results/
          if-no-files-found: ignore
          retention-days: 7
