name: Candidate Portal Regression

on:
  push:
    branches:
      - v2
      - main
  pull_request:
    branches:
      - v2
      - main
  workflow_dispatch:
    inputs:
      run_live_readonly:
        description: Run the candidate test-environment read-only regression
        required: true
        default: true
        type: boolean
      run_live_write:
        description: Run controlled candidate test-environment writable regression
        required: true
        default: false
        type: boolean
      run_live_journey:
        description: Run paid certification, learning, quiz, and exam signup journey in the test environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: candidate-regression-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && (inputs.run_live_write || inputs.run_live_journey) && 'live-mutation' || 'regular' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || (inputs.run_live_write != true && inputs.run_live_journey != true) }}

jobs:
  backend:
    name: Candidate BFF regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOPRIVATE: github.com/afnandelfin620-star/cftptest

    defaults:
      run:
        working-directory: candbff

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: candbff/go.mod
          cache-dependency-path: candbff/go.sum

      - name: Configure private Go module access
        env:
          CFTPTEST_READ_TOKEN: ${{ secrets.CFTPTEST_READ_TOKEN }}
        run: |
          if [ -z "$CFTPTEST_READ_TOKEN" ]; then
            echo "::error::Repository secret CFTPTEST_READ_TOKEN is required to download the private cftptest Go module."
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${CFTPTEST_READ_TOKEN}@github.com/afnandelfin620-star/cftptest".insteadOf \
            "https://github.com/afnandelfin620-star/cftptest"

      - name: Download Go modules
        run: go mod download

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go regression tests
        run: go test ./...

      - name: Enforce handler and router coverage floor
        shell: bash
        run: |
          go test -count=1 -coverprofile coverage.tmp ./handler ./server
          coverage="$(go tool cover -func coverage.tmp | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          echo "Candidate BFF handler/router coverage: ${coverage}%"
          if ! awk -v coverage="$coverage" 'BEGIN { exit (coverage + 0 >= 35.0) ? 0 : 1 }'; then
            echo "::error::Candidate BFF handler/router coverage ${coverage}% is below the 35.0% floor."
            exit 1
          fi

  regression:
    name: Candidate Playwright regression
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: candweb/vue-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: candweb/vue-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build candidate portal
        run: npm run build

      - name: Type-check Playwright suites
        run: npm run test:e2e:typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright regression
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: candidate-playwright-report
          path: |
            candweb/vue-web/playwright-report/
            candweb/vue-web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  live:
    name: Candidate live regression
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_live_readonly || inputs.run_live_write || inputs.run_live_journey) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: candweb/vue-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: candweb/vue-web/package-lock.json

      - name: Validate live regression base URL
        env:
          E2E_CANDIDATE_BASE_URL: ${{ secrets.E2E_CANDIDATE_BASE_URL }}
        shell: bash
        run: |
          if [ -z "$E2E_CANDIDATE_BASE_URL" ]; then
            echo "::error::Repository secret E2E_CANDIDATE_BASE_URL is required for the live regression."
            exit 1
          fi

      - name: Validate live candidate account secrets
        if: ${{ inputs.run_live_readonly || inputs.run_live_write || inputs.run_live_journey }}
        env:
          E2E_CANDIDATE_USERNAME: ${{ secrets.E2E_CANDIDATE_USERNAME }}
          E2E_CANDIDATE_PASSWORD: ${{ secrets.E2E_CANDIDATE_PASSWORD }}
        shell: bash
        run: |
          for name in E2E_CANDIDATE_USERNAME E2E_CANDIDATE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name} is required for the live regression."
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Type-check Playwright suites
        run: npm run test:e2e:typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live read-only regression
        if: ${{ inputs.run_live_readonly }}
        run: npm run test:e2e:live
        env:
          CI: "true"
          E2E_CANDIDATE_BASE_URL: ${{ secrets.E2E_CANDIDATE_BASE_URL }}
          E2E_CANDIDATE_USERNAME: ${{ secrets.E2E_CANDIDATE_USERNAME }}
          E2E_CANDIDATE_PASSWORD: ${{ secrets.E2E_CANDIDATE_PASSWORD }}

      - name: Run controlled live write regression
        if: ${{ inputs.run_live_write }}
        run: npm run test:e2e:live:write
        env:
          CI: "true"
          E2E_LIVE_WRITE_ENABLED: "true"
          E2E_LIVE_WRITE_BUNDLE_ID: ${{ vars.E2E_LIVE_WRITE_BUNDLE_ID }}
          E2E_CANDIDATE_BASE_URL: ${{ secrets.E2E_CANDIDATE_BASE_URL }}
          E2E_CANDIDATE_USERNAME: ${{ secrets.E2E_CANDIDATE_USERNAME }}
          E2E_CANDIDATE_PASSWORD: ${{ secrets.E2E_CANDIDATE_PASSWORD }}

      - name: Run paid certification, learning, quiz, and exam signup journey
        if: ${{ inputs.run_live_journey }}
        run: npm run test:e2e:live:journey
        env:
          CI: "true"
          E2E_LIVE_JOURNEY_ENABLED: "true"
          E2E_CANDIDATE_BASE_URL: ${{ secrets.E2E_CANDIDATE_BASE_URL }}
          E2E_CANDIDATE_USERNAME: ${{ secrets.E2E_CANDIDATE_USERNAME }}
          E2E_CANDIDATE_PASSWORD: ${{ secrets.E2E_CANDIDATE_PASSWORD }}
          E2E_STRIPE_TEST_EMAIL: ${{ vars.E2E_STRIPE_TEST_EMAIL }}

      - name: Upload sanitized live failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: candidate-live-regression-report
          path: candweb/vue-web/playwright-report-live/
          if-no-files-found: ignore
          retention-days: 3
