name: ${COMPOSE_PROJECT_NAME:-cftp}

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

x-bff-base: &bff-base
  restart: unless-stopped
  logging: *default-logging
  env_file:
    - ${PORTAL_ENV_FILE:-.env.dev}
  networks:
    web-net:
    backend-net:
    gateway-net:

services:
  candbff:
    image: ${IMAGE_REGISTRY:-localhost}/candbff:${IMAGE_TAG:-dev-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-cftp}-candbff
    <<: *bff-base
    networks:
      web-net:
      backend-net:
      gateway-net:
        aliases:
          - ${PORTAL_CONTAINER_PREFIX:?PORTAL_CONTAINER_PREFIX is required}-candbff
    environment:
      HTTP_ADDRESS: 0.0.0.0:8080
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required in the selected environment file}
      CFGSERVER_ADDR: ${CFGSERVER_ADDR:-}
      CASDOOR_ENDPOINT: ${CASDOOR_ENDPOINT:-}
      CASDOOR_PUBLIC_ENDPOINT: ${CASDOOR_PUBLIC_ENDPOINT:?CASDOOR_PUBLIC_ENDPOINT is required in the selected environment file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in the selected environment file}
      EXAM_CALLBACK_BASE_URL: ${EXAM_CALLBACK_BASE_URL:?EXAM_CALLBACK_BASE_URL is required in the selected environment file}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  adminbff:
    image: ${IMAGE_REGISTRY:-localhost}/adminbff:${IMAGE_TAG:-dev-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-cftp}-adminbff
    <<: *bff-base
    networks:
      web-net:
      backend-net:
      gateway-net:
        aliases:
          - ${PORTAL_CONTAINER_PREFIX:?PORTAL_CONTAINER_PREFIX is required}-adminbff
    environment:
      HTTP_ADDRESS: 0.0.0.0:8080
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required in the selected environment file}
      CFGSERVER_ADDR: ${CFGSERVER_ADDR:-}
      CASDOOR_ENDPOINT: ${CASDOOR_ENDPOINT:-}
      CASDOOR_PUBLIC_ENDPOINT: ${CASDOOR_PUBLIC_ENDPOINT:?CASDOOR_PUBLIC_ENDPOINT is required in the selected environment file}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in the selected environment file}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  candweb:
    image: ${IMAGE_REGISTRY:-localhost}/candweb:${IMAGE_TAG:-dev-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-cftp}-candweb
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 8080
    networks:
      web-net:
      gateway-net:
        aliases:
          - ${PORTAL_CONTAINER_PREFIX:?PORTAL_CONTAINER_PREFIX is required}-candweb
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminweb:
    image: ${IMAGE_REGISTRY:-localhost}/adminweb:${IMAGE_TAG:-dev-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-cftp}-adminweb
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 8081
    networks:
      web-net:
      gateway-net:
        aliases:
          - ${PORTAL_CONTAINER_PREFIX:?PORTAL_CONTAINER_PREFIX is required}-adminweb
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  web-net:
    name: ${WEB_NETWORK_NAME:-cftp-web-net}
    driver: bridge
  backend-net:
    name: ${BACKEND_NETWORK_NAME:-cftp-dev_cftp-net}
    external: true
  gateway-net:
    name: ${GATEWAY_NETWORK_NAME:-cftp-gateway-net}
    external: true
