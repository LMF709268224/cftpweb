name: ${COMPOSE_PROJECT_NAME:-cftp-web}

x-bff-base: &bff-base
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - web-net
    - backend-net

services:
  candbff:
    image: ${IMAGE_REGISTRY:-localhost}/candbff:${IMAGE_TAG:-v1}
    container_name: ${COMPOSE_PROJECT_NAME:-cftp-web}-candbff
    <<: *bff-base
    environment:
      HTTP_ADDRESS: 0.0.0.0:8080
      CFGSERVER_ADDR: ${CFGSERVER_ADDR:?CFGSERVER_ADDR is required in .env}
      CASDOOR_ENDPOINT: ${CASDOOR_ENDPOINT:-casdoor:8000}
      CASDOOR_PUBLIC_ENDPOINT: ${CASDOOR_PUBLIC_ENDPOINT:?CASDOOR_PUBLIC_ENDPOINT is required in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in .env}
      EXAM_CALLBACK_BASE_URL: ${EXAM_CALLBACK_BASE_URL:?EXAM_CALLBACK_BASE_URL is required in .env}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  adminbff:
    image: ${IMAGE_REGISTRY:-localhost}/adminbff:${IMAGE_TAG:-v1}
    container_name: ${COMPOSE_PROJECT_NAME:-cftp-web}-adminbff
    <<: *bff-base
    environment:
      HTTP_ADDRESS: 0.0.0.0:8080
      CFGSERVER_ADDR: ${CFGSERVER_ADDR:?CFGSERVER_ADDR is required in .env}
      CASDOOR_ENDPOINT: ${CASDOOR_ENDPOINT:-casdoor:8000}
      CASDOOR_PUBLIC_ENDPOINT: ${CASDOOR_PUBLIC_ENDPOINT:?CASDOOR_PUBLIC_ENDPOINT is required in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required in .env}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  candweb:
    image: ${IMAGE_REGISTRY:-localhost}/candweb:${IMAGE_TAG:-v1}
    container_name: ${COMPOSE_PROJECT_NAME:-cftp-web}-candweb
    restart: unless-stopped
    environment:
      PORT: 8080
    networks:
      - web-net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminweb:
    image: ${IMAGE_REGISTRY:-localhost}/adminweb:${IMAGE_TAG:-v1}
    container_name: ${COMPOSE_PROJECT_NAME:-cftp-web}-adminweb
    restart: unless-stopped
    environment:
      PORT: 8081
    networks:
      - web-net
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  web-net:
    name: ${WEB_NETWORK_NAME:-cftp-web-net}
    driver: bridge
  backend-net:
    name: ${BACKEND_NETWORK_NAME:-cftp-dev_cftp-net}
    external: true
